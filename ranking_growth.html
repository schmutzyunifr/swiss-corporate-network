<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Municipality Growth Ranking — Swiss Corporate Network</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #faf9f6; color: #2c2c2c;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px; height: 52px;
      background: #1b2a3b; color: #fff; flex-shrink: 0;
    }
    #back-btn {
      color: rgba(255,255,255,.7); text-decoration: none; font-size: 13px;
      padding: 5px 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,.2);
      transition: all .15s; white-space: nowrap; flex-shrink: 0;
    }
    #back-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    #topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
    #topbar-sub { font-size: 12px; color: rgba(255,255,255,.45); margin-left: auto; white-space: nowrap; }

    /* ── Controls ── */
    #controls {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 10px 24px; background: #fff;
      border-bottom: 1px solid #e8e5e0; flex-shrink: 0;
    }
    #search-wrap { position: relative; }
    #search {
      width: 260px; padding: 7px 32px 7px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; outline: none; font-family: inherit; color: #333;
    }
    #search:focus { border-color: #1f5fa6; box-shadow: 0 0 0 2px rgba(31,95,166,.1); }
    #search-clear {
      display: none; position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 13px; color: #aaa; line-height: 1;
    }
    #search-clear:hover { color: #555; }
    #filter-btns { display: flex; gap: 6px; }
    .filter-btn {
      padding: 5px 12px; border-radius: 16px; font-size: 12px; cursor: pointer;
      border: 1px solid #ddd; background: none; font-family: inherit; color: #666;
      transition: all .15s;
    }
    .filter-btn.active { background: #1b2a3b; color: #fff; border-color: #1b2a3b; }
    .filter-btn:hover:not(.active) { background: #f0ede8; }
    #summary { font-size: 12px; color: #999; margin-left: auto; }

    /* ── Table wrapper ── */
    #table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    /* ── Sticky header ── */
    thead th {
      position: sticky; top: 0; background: #f0ede8;
      padding: 9px 12px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
      color: #777; font-weight: 600; text-align: left;
      border-bottom: 2px solid #ddd9d2; white-space: nowrap;
      user-select: none;
    }
    thead th[data-sort] { cursor: pointer; }
    thead th[data-sort]:hover { background: #e8e4de; color: #333; }
    thead th.sort-asc .sort-arrow::after  { content: ' ↑'; }
    thead th.sort-desc .sort-arrow::after { content: ' ↓'; }

    /* ── Rows ── */
    tbody tr { border-bottom: 1px solid #f0ede8; transition: background .08s; }
    tbody tr:hover { background: #f5f3f0; }
    td { padding: 7px 12px; vertical-align: middle; }

    /* ── Column widths & styles ── */
    .col-pos   { width: 46px; text-align: center; font-size: 12px; color: #bbb; font-weight: 600; }
    .col-name  { min-width: 160px; }
    .mun-name  { font-weight: 600; color: #1b2a3b; font-size: 13px; }
    .mun-sub   { font-size: 11px; color: #bbb; margin-top: 1px; }
    .col-period { width: 140px; font-size: 12px; color: #555; line-height: 1.5; }
    .col-rank  { width: 110px; }
    .rank-val  { font-weight: 700; font-size: 13px; color: #333; }
    .rank-sub  { font-size: 11px; color: #aaa; margin-top: 1px; }
    .col-change { width: 90px; text-align: center; }
    .ch-up  { color: #27ae60; font-weight: 700; font-size: 14px; }
    .ch-dn  { color: #c0392b; font-weight: 700; font-size: 14px; }
    .ch-eq  { color: #aaa; font-size: 12px; }
    .ch-na  { color: #ccc; font-size: 12px; }
    .col-trend { width: 90px; }

    /* ── Empty state ── */
    #no-results {
      display: none; padding: 60px 24px;
      text-align: center; color: #aaa; font-size: 14px;
    }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #faf9f6;
      font-size: 14px; color: #aaa; flex-direction: column; gap: 10px;
    }
    #loading-spinner {
      width: 28px; height: 28px; border: 3px solid #e0ddd8;
      border-top-color: #1b2a3b; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Top/bottom medals ── */
    .medal-1 { color: #c9a227; }
    .medal-2 { color: #9ea7ad; }
    .medal-3 { color: #b07d3d; }
  </style>
</head>
<body>

<div id="loading">
  <div id="loading-spinner"></div>
  Loading growth data…
</div>

<!-- Top bar -->
<div id="topbar">
  <a href="map.html" id="back-btn">← Back to Map</a>
  <h1>Municipality Growth Ranking</h1>
  <span id="topbar-sub">Connectivity rank change · first vs. last active year</span>
</div>

<!-- Controls -->
<div id="controls">
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search municipality…" autocomplete="off"/>
    <button id="search-clear">✕</button>
  </div>
  <div id="filter-btns">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="up">Risers only ↑</button>
    <button class="filter-btn" data-filter="down">Fallers only ↓</button>
    <button class="filter-btn" data-filter="multi">Multi-year only</button>
  </div>
  <span id="summary"></span>
</div>

<!-- Table -->
<div id="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="col-pos">#</th>
        <th data-sort="name">Municipality <span class="sort-arrow"></span></th>
        <th data-sort="entry">Active period <span class="sort-arrow"></span></th>
        <th data-sort="firstRank">First rank <span class="sort-arrow"></span></th>
        <th data-sort="lastRank">Last rank <span class="sort-arrow"></span></th>
        <th data-sort="growth" class="sort-desc">Change <span class="sort-arrow"></span></th>
        <th>Rank trend</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="no-results">No municipalities match your search.</div>
</div>

<script>
const YEARS = [1934,1943,1960,1962,1963,1964,1965,1966,1969,1972,1975,
               1979,1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,
               1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,
               2000,2001,2002,2003];

let allRows = [];
let filtered = [];
let sortKey  = 'growth';
let sortAsc  = false;  // default: biggest improvers first
let activeFilter = 'all';

// ── Tiny rank trend sparkline ─────────────────────────────────────────────────
function trendSpark(rankByYear, years) {
  const W = 80, H = 22, pad = 2;
  const pts = years.filter(y => rankByYear[y] != null);
  if (pts.length < 2) {
    // single dot
    if (pts.length === 1) {
      return `<svg width="${W}" height="${H}"><circle cx="${W/2}" cy="${H/2}" r="2.5" fill="#bbb"/></svg>`;
    }
    return `<svg width="${W}" height="${H}"></svg>`;
  }
  const ranks  = pts.map(y => rankByYear[y]);
  const firstR = ranks[0], lastR = ranks[ranks.length - 1];
  const minR   = Math.min(...ranks), maxR = Math.max(...ranks), rangeR = maxR - minR || 1;
  const minYr  = pts[0],   maxYr  = pts[pts.length - 1], rangeYr = maxYr - minYr || 1;
  // Rank 1 = top of chart (smaller r → smaller cy → higher on screen)
  const cx = y => pad + ((y - minYr) / rangeYr) * (W - 2 * pad);
  const cy = r => pad + ((r - minR) / rangeR) * (H - 2 * pad);
  const poly = pts.map(y => `${cx(y).toFixed(1)},${cy(rankByYear[y]).toFixed(1)}`).join(' ');
  const color = firstR > lastR ? '#27ae60' : firstR < lastR ? '#c0392b' : '#aaa';
  const d0 = `<circle cx="${cx(pts[0]).toFixed(1)}" cy="${cy(firstR).toFixed(1)}" r="2" fill="${color}" opacity=".6"/>`;
  const d1 = `<circle cx="${cx(pts[pts.length-1]).toFixed(1)}" cy="${cy(lastR).toFixed(1)}" r="2.5" fill="${color}"/>`;
  return `<svg width="${W}" height="${H}" style="overflow:visible">
    <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${d0}${d1}
  </svg>`;
}

// ── Load & process ────────────────────────────────────────────────────────────
async function loadData() {
  const data = await fetch('mun_history.json').then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  });

  allRows = Object.entries(data).map(([gdenr, h]) => {
    const firstRank = h.rank[h.entry];
    const lastRank  = h.rank[h.exit];
    const firstN    = h.n[h.entry];
    const lastN     = h.n[h.exit];
    const firstCw   = h.cw[h.entry];
    const lastCw    = h.cw[h.exit];
    const growth    = (h.years.length > 1 && firstRank != null && lastRank != null)
                        ? firstRank - lastRank : null;
    const firstPct  = (firstRank && firstN) ? Math.ceil(firstRank / firstN * 100) : null;
    const lastPct   = (lastRank  && lastN)  ? Math.ceil(lastRank  / lastN  * 100) : null;
    return {
      gdenr: +gdenr,
      name: h.name || `gdenr ${gdenr}`,
      entry: h.entry, exit: h.exit, nYears: h.years.length,
      firstRank, lastRank, firstN, lastN, firstCw, lastCw,
      firstPct, lastPct, growth,
      rankByYear: h.rank, years: h.years,
    };
  });

  document.getElementById('loading').style.display = 'none';
  applyFilterAndSort();
}

// ── Filter + sort + render ────────────────────────────────────────────────────
function applyFilterAndSort() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  filtered = allRows.filter(r => {
    if (q && !r.name.toLowerCase().includes(q)) return false;
    if (activeFilter === 'up'    && !(r.growth > 0))  return false;
    if (activeFilter === 'down'  && !(r.growth < 0))  return false;
    if (activeFilter === 'multi' && r.nYears < 2)     return false;
    return true;
  });

  filtered.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') {
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    // Nulls go to end regardless of direction
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return sortAsc ? va - vb : vb - va;
  });

  renderTable();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody  = document.getElementById('tbody');
  const total  = allRows.length;
  const shown  = filtered.length;

  document.getElementById('summary').textContent =
    `${shown.toLocaleString()} of ${total.toLocaleString()} municipalities`;

  if (!filtered.length) {
    tbody.innerHTML = '';
    document.getElementById('no-results').style.display = 'block';
    return;
  }
  document.getElementById('no-results').style.display = 'none';

  tbody.innerHTML = filtered.map((r, i) => {
    // Position medal
    const pos = i + 1;
    const posHtml = pos <= 3 && !document.getElementById('search').value && activeFilter === 'all'
      ? `<span class="medal-${pos}">${['🥇','🥈','🥉'][pos-1]}</span>`
      : pos;

    // Change cell
    let changeHtml;
    if      (r.growth  > 0) changeHtml = `<span class="ch-up">↑ ${r.growth}</span>`;
    else if (r.growth  < 0) changeHtml = `<span class="ch-dn">↓ ${Math.abs(r.growth)}</span>`;
    else if (r.growth === 0) changeHtml = `<span class="ch-eq">no change</span>`;
    else                    changeHtml = `<span class="ch-na">—</span>`;

    // Period
    const period = r.entry === r.exit ? `${r.entry}` : `${r.entry} → ${r.exit}`;
    const yrsLabel = `${r.nYears} of ${YEARS.length} years`;

    // First / last rank cells
    const firstRankHtml = r.firstRank != null
      ? `<div class="rank-val">#${r.firstRank}</div>
         <div class="rank-sub">${r.firstPct != null ? `top ${r.firstPct}%` : ''} · ${r.firstCw ?? '—'} conn · ${r.entry}</div>`
      : `<span style="color:#bbb">—</span>`;
    const lastRankHtml = r.lastRank != null
      ? `<div class="rank-val">#${r.lastRank}</div>
         <div class="rank-sub">${r.lastPct != null ? `top ${r.lastPct}%` : ''} · ${r.lastCw ?? '—'} conn · ${r.exit}</div>`
      : `<span style="color:#bbb">—</span>`;

    return `<tr>
      <td class="col-pos">${posHtml}</td>
      <td class="col-name">
        <div class="mun-name">${r.name}</div>
        <div class="mun-sub">gdenr ${r.gdenr}</div>
      </td>
      <td class="col-period">${period}<br><span style="color:#bbb;font-size:11px">${yrsLabel}</span></td>
      <td class="col-rank">${firstRankHtml}</td>
      <td class="col-rank">${lastRankHtml}</td>
      <td class="col-change">${changeHtml}</td>
      <td class="col-trend">${trendSpark(r.rankByYear, r.years)}</td>
    </tr>`;
  }).join('');
}

// ── Sort header clicks ────────────────────────────────────────────────────────
document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = (key === 'name');  // A→Z by default for name; descending for numbers
    }
    document.querySelectorAll('thead th[data-sort]').forEach(h => {
      h.classList.remove('sort-asc', 'sort-desc');
    });
    th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    applyFilterAndSort();
  });
});

// ── Filter buttons ────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilterAndSort();
  });
});

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  document.getElementById('search-clear').style.display = e.target.value ? 'block' : 'none';
  applyFilterAndSort();
});
document.getElementById('search-clear').addEventListener('click', () => {
  document.getElementById('search').value = '';
  document.getElementById('search-clear').style.display = 'none';
  applyFilterAndSort();
  document.getElementById('search').focus();
});

// ── Keyboard shortcut: / to focus search ─────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape') document.getElementById('search').blur();
});

// ── Load ──────────────────────────────────────────────────────────────────────
loadData().catch(err => {
  document.getElementById('loading').innerHTML = `
    <div style="text-align:center;color:#c0392b;max-width:360px">
      <b>Could not load mun_history.json</b><br><br>
      <small style="color:#999">${err.message}</small><br><br>
      Run preprocess_history.py first, then serve via HTTP:<br>
      <code style="background:#eee;padding:4px 8px;border-radius:4px;display:inline-block;margin-top:6px">
        python -m http.server 8000
      </code><br><br>
      <a href="map.html" style="color:#1f5fa6">← Back to Map</a>
    </div>`;
});
</script>
</body>
</html>
